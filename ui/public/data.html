<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Data — Finance Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="data.css">
</head>
<body class="data-page">

  <!-- Film grain -->
  <div class="grain" aria-hidden="true"></div>

  <!-- Ticker strip -->
  <div class="ticker-strip">
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="data-ticker-label">
      <span class="t-badge">MY DATA</span>
      <span class="t-item" id="section-ticker-label">Profile</span>
    </div>
    <div class="ticker-right" id="ticker-date"></div>
  </div>

  <div class="shell">

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="2" width="20" height="20" stroke="currentColor" stroke-width="1.5"/>
            <line x1="2" y1="8.5" x2="22" y2="8.5" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
            <line x1="2" y1="15.5" x2="22" y2="15.5" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
            <line x1="8.5" y1="2" x2="8.5" y2="22" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
            <line x1="15.5" y1="2" x2="15.5" y2="22" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
            <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Finance</div>
          <div class="brand-sub">Intelligence</div>
        </div>
      </div>

      <div class="s-rule"></div>

      <div class="s-label">DATA SECTIONS</div>
      <nav class="s-nav" id="s-nav">
        <button class="s-btn active-section" data-tab="profile">
          <span class="s-num">01</span>
          <span class="s-text">Profile</span>
          <span class="s-arrow">→</span>
        </button>
        <button class="s-btn" data-tab="holdings">
          <span class="s-num">02</span>
          <span class="s-text">Holdings</span>
          <span class="s-arrow">→</span>
        </button>
        <button class="s-btn" data-tab="watchlist">
          <span class="s-num">03</span>
          <span class="s-text">Watchlist</span>
          <span class="s-arrow">→</span>
        </button>
        <button class="s-btn" data-tab="transactions">
          <span class="s-num">04</span>
          <span class="s-text">Transactions</span>
          <span class="s-arrow">→</span>
        </button>
        <button class="s-btn" data-tab="properties">
          <span class="s-num">05</span>
          <span class="s-text">Properties</span>
          <span class="s-arrow">→</span>
        </button>
        <button class="s-btn" data-tab="trades">
          <span class="s-num">06</span>
          <span class="s-text">Trade History</span>
          <span class="s-arrow">→</span>
        </button>
      </nav>

      <div class="s-rule"></div>

      <a class="s-btn s-back-link" href="/">
        <span class="s-num">‹</span>
        <span class="s-text">Back to Chat</span>
        <span class="s-arrow">→</span>
      </a>

      <div class="s-footer">
        Educational use only.<br>Not professional financial advice.
      </div>
    </aside>

    <!-- Data management main area -->
    <main class="data-main">
      <div class="data-section-header">
        <div>
          <div class="data-eyebrow" id="section-eyebrow">PROFILE</div>
          <h2 class="data-title" id="section-title">Your Profile</h2>
        </div>
        <button class="add-btn" id="add-btn" style="display:none">+ Add</button>
      </div>

      <div class="data-content" id="data-content">
        <div class="data-loading">Loading…</div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Add Item</h3>
        <button class="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <form id="modal-form" class="modal-form"></form>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn-gold"  id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-stack" id="toast-stack"></div>

  <script type="module" src="js/data/app.js"></script>
</body>
</html>
